<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>QuickAccess TV</title>
  <link rel="stylesheet" href="css/home.css">
</head>
<body>
  <div id="wallpaper"></div>
  <!-- Fondo 4K estilo Apple TV: visible solo con el dock en reposo; se difumina hacia el gris bajo el dock.
       Dos capas que se funden (crossfade) al rotar de imagen. -->
  <div id="backdrop"><div class="bd-layer" id="bd-a"></div><div class="bd-layer" id="bd-b"></div></div>

  <!-- Everything that slides up together when focus moves into the app grid -->
  <div id="page">
    <div class="glow" id="glow-a"></div>
    <div class="glow" id="glow-b"></div>

    <header id="clockbox">
      <div id="greeting"></div>
      <div id="clock"></div>
      <div id="date"></div>
    </header>

    <nav id="pills">
      <div class="pill" id="pill-inputs">
        <svg viewBox="0 0 24 24"><path d="M21,3H3C1.9,3 1,3.9 1,5v12c0,1.1 0.9,2 2,2h5v2h8v-2h5c1.1,0 1.99,-0.9 1.99,-2L23,5c0,-1.1 -0.9,-2 -2,-2zM21,17H3V5h18v12z"/></svg>
        <span>Entradas</span>
      </div>
      <div class="pill" id="pill-net">
        <svg viewBox="0 0 24 24" id="net-wifi"><path d="M1,9l2,2c4.97,-4.97 13.03,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/></svg>
        <svg viewBox="0 0 24 24" id="net-wired" class="hidden"><path d="M13,22h8v-7h-3v-4h-5V9h3V2H8v7h3v2H6v4H3v7h8v-7H8v-2h8v2h-3z"/></svg>
        <span id="net-label">Red</span>
      </div>
      <div class="pill round" id="pill-settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
      </div>
    </nav>

    <div id="title"></div>
    <div id="dock"></div>
    <div id="gridwrap"><div id="grid"></div></div>
  </div>

  <div id="glass"></div>

  <!-- Overlay de carpeta: se abre sobre el fondo difuminado al pulsar una carpeta -->
  <div id="folderview" class="hidden">
    <div id="folder-name"></div>
    <div id="folder-grid"></div>
  </div>

  <!-- Diálogo de nombre libre (teclado en pantalla de webOS) -->
  <div id="namedialog" class="hidden">
    <div class="nd-box">
      <div id="nd-title"></div>
      <input id="nd-input" type="text" maxlength="24" autocomplete="off" autocapitalize="sentences"
             spellcheck="false" inputmode="text" placeholder="Nombre de la carpeta">
      <div class="nd-hint">Escribe el nombre · OK para guardar · Atrás para cancelar</div>
    </div>
  </div>

  <!-- Acerca de / Novedades (Ajustes ⚙ → Novedades) -->
  <div id="about" class="hidden">
    <div class="about-box">
      <div class="about-title">QuickAccess TV<span class="about-ver" id="about-ver"></span></div>
      <div class="about-body" id="about-body"></div>
      <div class="about-hint">Atrás para cerrar</div>
    </div>
  </div>

  <div id="menu" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script src="js/version.js"></script>
  <script src="js/config.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
